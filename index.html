<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我们的时光簿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7efe4;color:#51453e;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}
main{max-width:900px;margin:auto;padding:20px 14px 50px}.card{background:#fffaf2;border:1px solid #eadcca;border-radius:20px;padding:18px;margin-bottom:14px}
h1,h2,h3{margin-top:0}.muted{color:#958273}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button,input,textarea,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:12px;padding:11px 15px;background:#806b59;color:#fff;font-weight:700}.soft{background:#eee1d1;color:#665548}
input,textarea,select{width:100%;padding:11px;border:1px solid #dfd0bd;border-radius:10px;background:#fffefb;margin-top:6px}
label{display:block;margin:12px 0;font-weight:700;font-size:14px}.tile{width:100%;text-align:left;background:#fffdf8;border:1px solid #eadcca;border-radius:16px;padding:16px;color:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{font-size:12px;background:#f1e2d0;border-radius:99px;padding:4px 9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.dish{border:1px dashed #d9c5ad;border-radius:14px;padding:12px;margin:10px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:12px 10px 30px}}
.hidden{display:none!important}
</style>
</head>
<body><main>
<section id="lock" class="card" style="text-align:center">
<h1>📖 我们的时光簿</h1><p class="muted">把一起走过的日子，好好收藏起来。</p>
<form id="login"><label>共享密码<input id="pwd" type="password" placeholder="请输入体验密码"></label>
<button class="btn" type="submit">打开时光簿</button><p id="err" style="color:#b96d62"></p><small class="muted">演示密码：1234</small></form>
</section>
<section id="app" class="hidden">
<div class="row"><div><p class="muted">两个人的共同记录</p><h1>我们的时光簿 🌷</h1></div><button id="logout" class="btn soft">锁定</button></div>
<nav class="actions"><button class="btn" data-view="home">首页</button><button class="btn soft" data-view="recent">最近记录</button><button class="btn soft" data-view="about">关于</button></nav>
<div id="content"></div>
</section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections=[
{id:'hengshui',name:'咪咪的衡水生活',emoji:'🌼',desc:'衡水本地生活与美食'},
{id:'shenyang',name:'柑柑的沈阳生活',emoji:'🌆',desc:'沈阳本地生活与美食'},
{id:'qianan',name:'迁安烟火',emoji:'🏮',desc:'迁安街巷里的烟火气'},
{id:'travel',name:'旅行日记',emoji:'🧳',desc:'按城市记录旅途中的风景与味道'}];
let db=JSON.parse(localStorage.getItem('timebook')||'null')||{cities:[],shops:[],meals:[],ci:1,si:1,mi:1};
let current={view:'home',section:null,city:null,shop:null};
const save=()=>localStorage.setItem('timebook',JSON.stringify(db));
function go(view){current.view=view;render()}
function render(){
if(current.view==='home')home();if(current.view==='recent')recent();if(current.view==='about')about();
}
function home(){$('content').innerHTML=`<section class="card"><h2>把平凡日子，写成我们的故事。</h2><p class="muted">选择板块，记录店铺、每次就餐和菜品详情。</p></section><section class="grid">${sections.map(s=>`<button class="tile" data-sec="${s.id}"><h2>${s.emoji}</h2><h3>${s.name}</h3><p class="muted">${s.desc}</p>进入记录 →</button>`).join('')}</section><section class="card"><b>记录统计</b><p class="muted">${db.shops.length} 家店铺 · ${db.meals.length} 次就餐 · ${db.cities.length} 个旅行城市</p></section>`;
document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{current.section=b.dataset.sec;current.city=null;current.shop=null;current.view='section';sectionView()})}
function sectionView(){if(current.section==='travel'&&!current.city)return cities();if(current.section==='travel'&&current.city)return cityShops();shops()}
function backHome(){current={view:'home',section:null,city:null,shop:null};render()}
function cities(){$('content').innerHTML=`<div class="card"><div class="row"><div><h2>🧳 旅行城市</h2><p class="muted">先添加城市，再在城市里面添加餐馆。</p></div><button class="btn" id="add">＋ 添加城市</button></div></div><section class="grid">${db.cities.map(c=>`<button class="tile" data-city="${c.id}"><h3>📍 ${esc(c.name)}</h3><p class="muted">${esc(c.note)}</p>进入城市 →</button>`).join('')||'<div class="card muted">还没有旅行城市，先添加“济南”吧。</div>'}</section><button class="btn soft" id="back">← 返回首页</button>`;
$('add').onclick=addCity;$('back').onclick=backHome;document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{current.city=+b.dataset.city;sectionView()})}
function addCity(){$('content').innerHTML=`<section class="card"><h2>添加旅行城市</h2><form id="f"><label>城市名称<input id="n" required placeholder="例如：济南"></label><label>城市记录<textarea id="note" rows="3" placeholder="旅行日期、城市印象……"></textarea></label><button class="btn">保存城市</button> <button type="button" class="btn soft" id="cancel">取消</button></form></section>`;$('cancel').onclick=cities;$('f').onsubmit=e=>{e.preventDefault();db.cities.push({id:db.ci++,name:$('n').value.trim(),note:$('note').value.trim()});save();cities()}}
function cityShops(){let c=db.cities.find(x=>x.id===current.city);shops('travel',current.city,c)}
function shops(section=current.section,city=null,cityObj=null){let s=sections.find(x=>x.id===section),list=db.shops.filter(x=>x.section===section&&x.city===city);$('content').innerHTML=`<section class="card"><div class="row"><div><p class="muted">${cityObj?'旅行日记 / 城市':''}</p><h2>${cityObj?'📍 '+esc(cityObj.name):s.emoji+' '+s.name}</h2><p class="muted">${cityObj?esc(cityObj.note):s.desc}</p></div><button class="btn" id="add">＋ 添加店铺</button></div></section><section class="grid">${list.map(x=>`<button class="tile" data-shop="${x.id}"><h3>🍜 ${esc(x.name)}</h3><p class="muted">${esc(x.address)}</p>${db.meals.filter(m=>m.shop===x.id).length} 次就餐记录 →</button>`).join('')||'<div class="card muted">还没有店铺记录。</div>'}</section><button class="btn soft" id="back">← 返回</button>`;$('add').onclick=()=>addShop(section,city);$('back').onclick=()=>cityObj?cities():backHome();document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{current.shop=+b.dataset.shop;shopView()})}
function addShop(section,city){$('content').innerHTML=`<section class="card"><h2>添加店铺</h2><form id="f"><label>店铺名称<input id="n" required placeholder="例如：某某餐馆"></label><label>地址或位置<input id="a" placeholder="例如：济南市芙蓉街"></label><label>店铺印象<textarea id="note" rows="3"></textarea></label><button class="btn">保存店铺</button> <button type="button" class="btn soft" id="cancel">取消</button></form></section>`;$('cancel').onclick=section==='travel'?cityShops:()=>shops(section);$('f').onsubmit=e=>{e.preventDefault();db.shops.push({id:db.si++,section,city,name:$('n').value.trim(),address:$('a').value.trim(),note:$('note').value.trim()});save();section==='travel'?cityShops():shops(section)}}
function shopView(){let s=db.shops.find(x=>x.id===current.shop),list=db.meals.filter(x=>x.shop===s.id);$('content').innerHTML=`<section class="card"><div class="row"><div><h2>🍜 ${esc(s.name)}</h2><p class="muted">${esc(s.address)}</p><p>${esc(s.note)}</p></div><button class="btn" id="add">＋ 添加就餐记录</button></div></section><h2>就餐记录</h2>${list.map(m=>`<button class="tile" data-meal="${m.id}"><div class="row"><b>${esc(m.title)}</b><span class="tag">${esc(m.date)}</span></div><p class="muted">${m.dishes.length} 道菜品详情</p></button>`).join('')||'<div class="card muted">还没有就餐记录。</div>'}<button class="btn soft" id="back">← 返回</button>`;$('add').onclick=()=>addMeal(s);$('back').onclick=()=>s.section==='travel'?cityShops():shops(s.section);document.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>mealView(+b.dataset.meal))}
function addMeal(shop){$('content').innerHTML=`<section class="card"><h2>添加就餐记录</h2><p class="muted">${esc(shop.name)}</p><form id="f"><label>就餐日期<input id="date" type="date" required></label><label>本次就餐标题<input id="title" required placeholder="例如：周末晚餐"></label><label>整体感受<textarea id="feeling" rows="3"></textarea></label><h3>菜品详情</h3><div id="ds"></div><button type="button" class="btn soft" id="more">＋ 添加菜品详情</button><div class="actions"><button class="btn">保存就餐记录</button><button type="button" class="btn soft" id="cancel">取消</button></div></form></section>`;$('date').value=new Date().toISOString().slice(0,10);let count=0;function dish(){count++;let d=document.createElement('div');d.className='dish';d.innerHTML=`<h3>菜品详情 ${count}</h3><label>菜品名称<input class="dn" required></label><label>口味<input class="dt"></label><label>分量<input class="da"></label><label>优点<input class="dp"></label><label>缺点<input class="dc"></label><label>食用感受<textarea class="df" rows="2"></textarea></label><button type="button" class="btn soft">删除这道菜</button>`;d.querySelector('button').onclick=()=>d.remove();$('ds').append(d)}dish();$('more').onclick=dish;$('cancel').onclick=()=>shopView();$('f').onsubmit=e=>{e.preventDefault();let dishes=[...document.querySelectorAll('.dish')].map(d=>({name:d.querySelector('.dn').value,taste:d.querySelector('.dt').value,amount:d.querySelector('.da').value,pros:d.querySelector('.dp').value,cons:d.querySelector('.dc').value,feeling:d.querySelector('.df').value}));db.meals.push({id:db.mi++,shop:shop.id,date:$('date').value,title:$('title').value,feeling:$('feeling').value,dishes});save();shopView()}}
function mealView(id){let m=db.meals.find(x=>x.id===id),s=db.shops.find(x=>x.id===m.shop);$('content').innerHTML=`<section class="card"><span class="tag">${esc(m.date)}</span><h2>${esc(m.title)}</h2><p class="muted">${esc(s.name)}</p><p>${esc(m.feeling)}</p></section><h2>菜品详情</h2>${m.dishes.map((d,i)=>`<article class="card"><h3>${i+1}. ${esc(d.name)}</h3><p><b>口味：</b>${esc(d.taste)}</p><p><b>分量：</b>${esc(d.amount)}</p><p><b>优点：</b>${esc(d.pros)}</p><p><b>缺点：</b>${esc(d.cons)}</p><p><b>食用感受：</b>${esc(d.feeling)}</p></article>`).join('')}<button class="btn soft" id="back">← 返回店铺</button>`;$('back').onclick=()=>{current.shop=s.id;shopView()}}
function recent(){$('content').innerHTML='<section class="card"><h2>最近记录</h2><p class="muted">所有板块的就餐记录都会显示在这里。</p></section>'+[...db.meals].reverse().map(m=>{let s=db.shops.find(x=>x.id===m.shop);return`<button class="tile" data-meal="${m.id}"><b>${esc(m.title)}</b><span class="tag">${esc(m.date)}</span><p class="muted">${esc(s?.name||'未知店铺')} · ${m.dishes.length} 道菜品详情</p></button>`}).join('')||'<div class="card muted">还没有记录。</div>';document.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>mealView(+b.dataset.meal))}
function about(){$('content').innerHTML='<section class="card"><h2>关于我们的时光簿</h2><p>生活板块 → 店铺 → 多次就餐 → 菜品详情</p><p>旅行日记 → 城市 → 店铺 → 多次就餐 → 菜品详情</p><p class="muted">当前数据保存在本浏览器中。</p></section>'}
$('login').onsubmit=e=>{e.preventDefault();if($('pwd').value.trim()==='1234'){$('lock').classList.add('hidden');$('app').classList.remove('hidden');render()}else $('err').textContent='密码不正确，请输入 1234'};
$('logout').onclick=()=>{$('app').classList.add('hidden');$('lock').classList.remove('hidden');$('pwd').value=''};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
render();
</script></body></html>
