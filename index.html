<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我们的时光簿 · 手账版 v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fbf2e6,#f1e3d6);color:#51453e;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}main{max-width:980px;margin:auto;padding:22px 14px 60px}h1,h2,h3{margin-top:0}.card{background:#fffaf2;border:1px solid #eadcca;border-radius:22px;padding:18px;margin:0 0 15px;box-shadow:0 5px 18px #8b6c4510}.muted{color:#978575}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}button,input,textarea,select{font:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid #dbcbb9;border-radius:12px;background:#fffdf8;color:inherit}textarea{min-height:88px;resize:vertical}.btn{border:0;border-radius:13px;padding:10px 14px;background:#806b59;color:white;font-weight:700;cursor:pointer}.soft{background:#eee1d1;color:#665548}.danger{background:#b66b61}.tile{width:100%;text-align:left;border:1px solid #eadcca;border-radius:17px;padding:15px;background:#fffdf8;color:inherit;cursor:pointer}.tile:hover{transform:translateY(-1px)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#f0e2cf;font-size:13px;margin:2px}.sectionTitle{font-size:18px;font-weight:800;margin-bottom:10px}.emoji{font-size:28px}.entry{border-left:4px solid #d6b58e;padding:10px 12px;background:#fffdf8;border-radius:12px;margin:8px 0}.stars{color:#b47b38;letter-spacing:2px}.hint{font-size:13px;color:#9b8978}.mode{display:flex;gap:8px}.mode button.active{background:#806b59;color:#fff}.result{white-space:pre-wrap;background:#f5eadc;border-radius:14px;padding:12px}.small{font-size:13px}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<main>
<div class="between">
  <div><h1>📖 我们的时光簿</h1><div class="muted">把平凡日子，收进一本温柔的手账。</div></div>
  <button class="btn soft" onclick="showHome()">回到首页</button>
</div>

<section id="home" class="card">
  <div class="between"><h2>选择一个时光板块</h2><span class="tag">本地保存</span></div>
  <label style="display:block;margin:10px 0">🔎 搜索全部时光记录
    <input id="globalSearch" placeholder="搜索城市、区县、店铺、菜品、评价、金额……" oninput="renderBoards()">
  </label>
  <div id="globalSearchResults" class="muted small"></div>
  <div id="boards" class="grid"></div>
</section>

<section id="workspace" class="hidden">
  <div class="card">
    <div class="between"><div><div class="muted" id="crumb"></div><h2 id="workspaceTitle"></h2></div><button class="btn soft" onclick="showHome()">返回板块</button></div>
    <div class="mode">
      <button id="quickMode" class="btn active" onclick="setMode('quick')">⚡ 速记一条</button>
      <button id="detailMode" class="btn soft" onclick="setMode('detail')">📝 详细记录</button>
    </div>
  </div>

  <section id="quickPanel" class="card">
    <h3>⚡ 速记一条</h3>
    <p class="muted">先选定板块，再把想到的内容一口气写下来。系统会识别城市、区县、店铺、菜品、日期、餐次、金额、评价，并自动判断三挡推荐等级。</p>
    <div id="quickCityWrap"></div>
    <label>速记内容</label>
    <textarea id="quickText" placeholder="例：济南历下区，9月15日晚餐去了阿水大杯茶，点了杨枝甘露和蛋糕，花了68元，味道不错，下次还来"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="parseQuick()">自动识别并预览</button><button class="btn soft" onclick="document.getElementById('quickText').value=''">清空</button></div>
    <div id="quickPreview" class="hidden" style="margin-top:12px"></div>
  </section>

  <section id="detailPanel" class="card hidden">
    <h3>📝 详细记录</h3>
    <div id="detailForm"></div>
  </section>

  <section class="card">
    <div class="between"><h3 id="recordsHeading">记录簿</h3><span class="hint">按时间由新到旧</span></div>
    <div id="records"></div>
  </section>
  <section id="recordDetail" class="card hidden"></section>
</section>
</main>

<script>
const boards=[
 {id:'hengshui',name:'咪咪的衡水生活',icon:'🌷'},
 {id:'shenyang',name:'柑柑的沈阳生活',icon:'🍊'},
 {id:'qianan',name:'迁安烟火',icon:'🏡'},
 {id:'travel',name:'旅行日记',icon:'🧳'}
];
const icons={cake:'🍰',noodle:'🍜',hotpot:'🍲',coffee:'☕',tea:'🧋',bbq:'🍢',western:'🍔',bakery:'🥐',dessert:'🍮',seafood:'🦐',breakfast:'🥞',late:'🌙',snack:'🍡',home:'🍳',takeout:'🛵',sushi:'🍣',spicy:'🌶️',buffet:'🍽️',vegetarian:'🥗',fastfood:'🍟',default:'📍'};
let data={};
try{
  const saved=localStorage.getItem('timebook_v3');
  data=saved?JSON.parse(saved):{};
  if(!data||typeof data!=='object'||Array.isArray(data))data={};
}catch(error){data={};}
let current=null,mode='quick',draft=null;
function save(){localStorage.setItem('timebook_v3',JSON.stringify(data))}
function getBoard(id){return data[id]||(data[id]={cities:[],records:[]})}
function showHome(){current=null;document.getElementById('home').classList.remove('hidden');document.getElementById('workspace').classList.add('hidden');renderBoards()}
function openBoard(id){
  current=id;
  const board=boards.find(x=>x.id===id)||boards[0];
  document.getElementById('home').classList.add('hidden');
  document.getElementById('workspace').classList.remove('hidden');
  document.getElementById('workspaceTitle').textContent=board.name;
  document.getElementById('crumb').textContent='时光板块';
  setMode('quick');
  if(typeof renderQuickCity==='function')renderQuickCity();
  if(typeof renderDetail==='function')renderDetail();
  if(typeof renderRecords==='function')renderRecords();
}
function renderBoards(){
  const q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();

  // 板块卡片始终显示，避免搜索或刷新后把“可进入的板块”过滤掉。
  document.getElementById('boards').innerHTML=boards.map(b=>
    `<button class="tile" onclick="openBoard('${b.id}')">
      <span class="emoji">${b.icon}</span>
      <h3>${b.name}</h3>
      <div class="muted">${b.id==='travel'?'按城市整理旅行餐馆与回忆':'记录城市、店铺与生活美食'}</div>
    </button>`
  ).join('');

  const resultEl=document.getElementById('globalSearchResults');
  if(!q){ resultEl.innerHTML=''; return; }

  const hits=[];
  boards.forEach(b=>{
    const bdata=getBoard(b.id);
    (bdata.records||[]).forEach(r=>{
      // 搜索内容只来自记录本身，不把“柑柑的沈阳生活”等板块名称当作命中内容。
      const text=[
        r.city,r.district,r.shop,r.dishes,r.review,r.date,r.meal,r.amount,
        r.rank==='wow'?'夯爆了绝不踩雷':r.rank==='avoid'?'下次绕道走':'平平稳稳'
      ].filter(Boolean).join(' ').toLowerCase();
      if(text.includes(q)){
        hits.push({board:b,record:r});
      }
    });
  });

  if(!hits.length){
    resultEl.innerHTML='<div class="muted small">没有找到匹配的城市、区县、店铺或记录内容。</div>';
    return;
  }

  resultEl.innerHTML='<div class="sectionTitle">搜索结果</div>'+
    hits.map(({board:b,record:r})=>{
      const place=[r.city,r.district].filter(Boolean).join(' · ');
      const icon=(typeof icons!=='undefined'&&(r.customIcon||icons[r.type]))||(b.id==='travel'?'🧳':'📍');
      return `<button class="tile" style="margin:6px 0" onclick="openBoard('${b.id}')">
        <div class="between"><strong>${icon} ${escapeHtml(r.shop||'未命名店铺')}</strong><span class="tag">${escapeHtml(b.name)}</span></div>
        <div class="small muted">${escapeHtml(place||'未填写地点')} ${escapeHtml(r.date||'')}</div>
        <div>${escapeHtml((r.dishes||r.review||'暂无详情').slice(0,100))}</div>
      </button>`;
    }).join('');
}

function setMode(m){
  mode=m;
  const quick=document.getElementById('quickPanel');
  const detail=document.getElementById('detailPanel');
  const qb=document.getElementById('quickMode');
  const db=document.getElementById('detailMode');
  if(quick)quick.classList.toggle('hidden',m!=='quick');
  if(detail)detail.classList.toggle('hidden',m!=='detail');
  if(qb){qb.classList.toggle('active',m==='quick');qb.classList.toggle('soft',m!=='quick');}
  if(db){db.classList.toggle('active',m==='detail');db.classList.toggle('soft',m!=='detail');}
  if(m==='detail' && current){
    renderDetail();
  }
}

function renderDetail(){
  const travel=current==='travel';
  const board=getBoard(current);
  const cityOptions=(board.cities||[]).map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  const form=document.getElementById('detailForm');
  if(!form)return;

  form.innerHTML=`
    ${travel?`<div class="card" style="background:#f8eee2">
      <h3>🗺️ 先添加城市</h3>
      <div class="row">
        <input id="newCity" placeholder="例如：济南">
        <button class="btn" type="button" onclick="addCity()">添加城市</button>
      </div>
      <div class="hint" style="margin-top:6px">已有城市：${(board.cities||[]).map(c=>`<span class="tag">${escapeHtml(c)}</span>`).join('')||'暂无'}</div>
    </div>`:''}
    <div class="grid">
      ${travel?`<label>城市<select id="city">${cityOptions||'<option value="">请先添加城市</option>'}</select></label>`:''}
      <label>店铺名称<input id="shop" placeholder="例如：某某面馆"></label>
      <label>店铺类型<select id="type">
        <option value="default">默认标志 📍</option>
        <option value="cake">蛋糕店 🍰</option><option value="noodle">面馆 🍜</option>
        <option value="hotpot">火锅店 🍲</option><option value="coffee">咖啡店 ☕</option>
        <option value="tea">奶茶店 🧋</option><option value="bbq">烧烤店 🍢</option>
        <option value="western">汉堡/西餐 🍔</option><option value="bakery">面包店 🥐</option>
        <option value="dessert">甜品店 🍮</option><option value="seafood">海鲜店 🦐</option>
        <option value="breakfast">早餐店 🥞</option><option value="late">夜宵店 🌙</option>
        <option value="snack">小吃/夜市 🍡</option><option value="home">家常菜馆 🍳</option>
        <option value="takeout">外卖 🛵</option><option value="sushi">日料/寿司 🍣</option>
        <option value="spicy">川湘菜/辣味 🌶️</option><option value="buffet">自助餐 🍽️</option>
        <option value="vegetarian">素食/轻食 🥗</option><option value="fastfood">快餐 🍟</option>
      </select></label>
      <label>自定义图标（可选）<input id="customIcon" maxlength="4" placeholder="例如：🐼、🍕"></label>
      <label>日期<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <label>餐次<select id="meal"><option>早餐</option><option selected>午餐</option><option>晚餐</option><option>下午茶</option><option>夜宵</option><option>其他</option></select></label>
      <label>金额（元）<input id="amount" type="number" min="0" step="0.01" placeholder="可不填"></label>
      <label>三挡评价<select id="rank"><option value="avoid">🚫 下次绕道走</option><option value="okay" selected>🙂 平平稳稳</option><option value="wow">🔥 夯爆了·绝不踩雷</option></select></label>
    </div>
    <label>菜品详情（每行一道菜）<textarea id="dishes" placeholder="例如：番茄牛肉面｜汤浓，牛肉稍少"></textarea></label>
    <label>整体评价与食用感受<textarea id="review" placeholder="今天吃得怎么样？"></textarea></label>
    <button class="btn" type="button" onclick="saveDetail()">保存这次记录</button>
  `;
}

function addCity(){
  const el=document.getElementById('newCity');
  const value=(el?.value||'').trim();
  if(!value){alert('请先填写城市');return;}
  const board=getBoard(current);
  if(!board.cities.includes(value))board.cities.push(value);
  save();
  renderDetail();
}

function renderQuickCity(){
  const el=document.getElementById('quickCityWrap'); if(!el)return;
  if(current==='travel'){
    el.innerHTML=`<label>旅行城市（可先选择，也可让速记自动识别）<select id="quickCity"><option value="">自动识别/暂不选择</option>${cityOptions()}</select></label>`;
  }else el.innerHTML='';
}
function normalizeDate(s){
  const m=String(s||'').match(/(\\d{4})[年\\/-](\\d{1,2})[月\\/-](\\d{1,2})日?/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const n=String(s||'').match(/(\\d{1,2})月(\\d{1,2})日?/);
  if(n){
    const y=new Date().getFullYear();
    return `${y}-${String(n[1]).padStart(2,'0')}-${String(n[2]).padStart(2,'0')}`;
  }
  return '';
}
function inferRank(t){
  if(/绝不去|再也不去|踩雷|难吃|难喝|失望|差评|糟糕|避雷|不推荐|太贵|不值|恶心|很差/.test(t))return 'avoid';
  if(/夯爆|爆好吃|超级好吃|太好吃|惊艳|绝了|强烈推荐|必吃|还会再来|下次还来|好吃|好喝|满意|推荐|喜欢/.test(t))return 'wow';
  return 'okay';
}
function cleanShop(s){
  return (s||'').replace(/^(去了|去|到|在|打卡|吃了|喝了)/,'').replace(/(，|,|。|；|;).*$/,'').trim();
}
function parseQuick(){
  let t=document.getElementById('quickText').value.trim();if(!t)return;
  let city='',district='',shop='',amount='',date='',meal='',dishes='',review=t;
  const cityMatch=t.match(/(?:去|到|在|来自|旅行到|旅行去)?\s*([\u4e00-\u9fa5]{2,8})(?:市)?(?:的)?\s*(?=[\u4e00-\u9fa5]{2,8}区|\u4e00-\u9fa5{2,8}县|去了|到|在|喝了|吃了)/);
  if(cityMatch)city=cityMatch[1];
  const districtMatch=t.match(/([\u4e00-\u9fa5]{2,8}(?:区|县))/);if(districtMatch)district=districtMatch[1];
  const money=t.match(/(?:花了|金额|消费|共计|共|￥|¥)\s*([0-9]+(?:\.[0-9]+)?)/);if(money)amount=money[1];
  const dateMatch=t.match(/(?:\d{4}[年\/-]\d{1,2}[月\/-]\d{1,2}日?|\d{1,2}月\d{1,2}日?)/);if(dateMatch)date=normalizeDate(dateMatch[0]);
  if(/早餐|早饭|早上/.test(t))meal='早餐';else if(/午餐|午饭|中餐|中午/.test(t))meal='午餐';else if(/晚餐|晚饭|晚上/.test(t))meal='晚餐';else if(/下午茶/.test(t))meal='下午茶';else if(/夜宵|宵夜|深夜/.test(t))meal='夜宵';
  const shopMatch=t.match(/(?:去了|去|到|在|打卡|喝了|吃了)\s*([^，,。；;]+?)(?=(?:，|,|。|；|;|点了|花了|很好|好喝|好吃|味道|下次|$))/);
  if(shopMatch)shop=cleanShop(shopMatch[1]);
  if(!shop){
    const fallback=t.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,20}(?:店|馆|坊|面馆|餐厅|茶|咖啡|蛋糕|小吃|火锅))/);
    if(fallback)shop=fallback[1];
  }
  const dishMatch=t.match(/(?:点了|吃了|喝了|菜品|餐品)\s*([^。；;]+)/);
  if(dishMatch)dishes=dishMatch[1].replace(/[、和及＋+]/g,'\n').replace(/，.*$/,'').trim();
  draft={city:city||document.getElementById('quickCity')?.value||'',district,shop,amount,date,meal,dishes,review,rank:inferRank(t)};
  const labels=[['城市',draft.city||'未识别'],['区县',draft.district||'未识别'],['店铺',draft.shop||'未识别'],['菜品详情',draft.dishes||'未识别'],['日期',draft.date||'未识别'],['餐次',draft.meal||'未识别'],['金额',draft.amount?`¥${draft.amount}`:'未识别'],['三挡评价',draft.rank==='avoid'?'🚫 下次绕道走':draft.rank==='wow'?'🔥 夯爆了·绝不踩雷':'🙂 平平稳稳'],['整体感受',draft.review]];
  document.getElementById('quickPreview').classList.remove('hidden');
  document.getElementById('quickPreview').innerHTML='<h4>识别结果（可转为详细记录修改）</h4><div class="result">'+labels.map(x=>`<div><b>${x[0]}：</b>${escapeHtml(x[1])}</div>`).join('')+'</div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveQuick()">按识别结果保存</button><button class="btn soft" onclick="editQuick()">转为详细记录修改</button></div>';
}
function editQuick(){
  if(!draft){
    alert('请先点击“自动识别并预览”，再转为详细记录。');
    return;
  }
  setMode('detail');
  renderDetail();

  // 等详细表单生成后，再把速记结果逐项填入。
  const fill=(id,value)=>{
    const el=document.getElementById(id);
    if(el && value!==undefined && value!==null)el.value=value;
  };

  fill('shop',draft.shop||'');
  fill('amount',draft.amount||'');
  fill('date',normalizeDate(draft.date||''));
  fill('meal',draft.meal||'午餐');
  fill('dishes',draft.dishes||'');
  fill('review',draft.review||'');

  if(current==='travel'){
    const city=draft.city||'';
    const board=getBoard(current);
    if(city && !board.cities.includes(city)){
      board.cities.push(city);
      save();
      renderDetail();
    }
    fill('city',city);
  }

  const rankEl=document.getElementById('rank');
  if(rankEl)rankEl.value=draft.rank||inferRank(draft.review||'');
}

function saveQuick(){
  if(!draft)return;let b=getBoard(current);
  if(current==='travel'&&draft.city&&!b.cities.includes(draft.city))b.cities.push(draft.city);
  b.records.push({...draft,id:Date.now(),type:'default',customIcon:''});
  save();renderRecords();renderBoards();document.getElementById('quickText').value='';document.getElementById('quickPreview').classList.add('hidden');alert('速记已保存！');
}
function saveDetail(){
  let b=getBoard(current);let city=current==='travel'?document.getElementById('city').value:'';
  if(current==='travel'&&!city)return alert('请先添加并选择城市');
  let shop=document.getElementById('shop').value.trim();if(!shop)return alert('请填写店铺名称');
  let review=document.getElementById('review').value;
  b.records.push({id:Date.now(),city,shop,type:document.getElementById('type').value,customIcon:document.getElementById('customIcon').value.trim(),date:document.getElementById('date').value,meal:document.getElementById('meal').value,amount:document.getElementById('amount').value,dishes:document.getElementById('dishes').value,review,rank:document.getElementById('rank').value});
  save();renderRecords();renderBoards();alert('详细记录已保存！');
}
function rankLabel(rank){return rank==='avoid'?'🚫 下次绕道走':rank==='wow'?'🔥 夯爆了·绝不踩雷':'🙂 平平稳稳'}

let navState={city:null,rank:null,icon:null,recordId:null};

function rankLabel(rank){
  return rank==='wow'?'🔥 夯爆了·绝不踩雷':rank==='avoid'?'🚫 下次绕道走':'🙂 平平稳稳';
}
function recordIcon(r){
  return r.customIcon||icons[r.type]||'📍';
}
function sortedRecords(records){
  return [...records].sort((a,b)=>{
    const da=Date.parse(a.date||'')||0, db=Date.parse(b.date||'')||0;
    return db-da || (Number(b.id)||0)-(Number(a.id)||0);
  });
}
function rankBuckets(records){
  return {
    wow:records.filter(r=>r.rank==='wow'),
    okay:records.filter(r=>!r.rank||r.rank==='okay'),
    avoid:records.filter(r=>r.rank==='avoid')
  };
}
function renderRankCards(records, prefix){
  const buckets=rankBuckets(records);
  return ['wow','okay','avoid'].map(rank=>`
    <button class="tile" onclick="openRank('${rank}')">
      <div class="emoji">${rank==='wow'?'🔥':rank==='okay'?'🙂':'🚫'}</div>
      <h3>${rankLabel(rank)}</h3>
      <div class="muted">${buckets[rank].length} 条记录</div>
    </button>`).join('');
}
function renderRecords(){
  const b=getBoard(current);
  navState.recordId=null;
  document.getElementById('recordDetail').classList.add('hidden');
  document.getElementById('recordsHeading').textContent=current==='travel'?(navState.city?'城市记录 · '+navState.city:'旅行城市'):'记录簿';
  if(current==='travel'&&!navState.city){
    const cities=[...(b.cities||[])];
    const used=b.records.map(r=>r.city).filter(Boolean);
    used.forEach(c=>{if(!cities.includes(c))cities.push(c)});
    document.getElementById('records').innerHTML=cities.length?cities.map(c=>`
      <button class="tile" onclick="openCity('${escapeAttr(c)}')">
        <span class="emoji">🗺️</span><h3>${escapeHtml(c)}</h3>
        <div class="muted">${b.records.filter(r=>r.city===c).length} 条记录</div>
      </button>`).join(''):'<div class="muted">还没有城市，请在详细记录中先添加城市。</div>';
    return;
  }
  const records=navState.city?b.records.filter(r=>r.city===navState.city):b.records;
  if(!navState.rank){
    document.getElementById('records').innerHTML=renderRankCards(records,'');
    return;
  }
  const filtered=sortedRecords(records.filter(r=>r.rank===navState.rank||(navState.rank==='okay'&&!r.rank)));
  const iconSet=[...new Set(filtered.map(recordIcon))];
  const iconFilter=navState.icon?filtered.filter(r=>recordIcon(r)===navState.icon):filtered;
  document.getElementById('records').innerHTML=`
    <div class="row" style="margin-bottom:10px">
      <button class="btn soft" onclick="backToRanks()">返回三档</button>
      <button class="btn soft" onclick="clearIconFilter()">查看全部</button>
    </div>
    <div class="row">${iconSet.map(ic=>`<button class="btn soft" onclick="filterIcon('${escapeAttr(ic)}')">${ic}</button>`).join('')}</div>
    <div class="hint" style="margin:8px 0">当前：${rankLabel(navState.rank)}${navState.icon?' · 图标 '+navState.icon:''}</div>
    ${iconFilter.length?iconFilter.map(r=>`
      <button class="tile" style="margin:6px 0" onclick="openRecord('${r.id}')">
        <div class="between"><strong>${recordIcon(r)} ${escapeHtml(r.shop||'未命名店铺')}</strong><span class="tag">${escapeHtml(r.date||'未填写日期')}</span></div>
        <div class="small muted">${escapeHtml([r.city,r.district,r.meal].filter(Boolean).join(' · '))}</div>
        <div>${escapeHtml((r.dishes||r.review||'暂无详情').slice(0,120))}</div>
      </button>`).join(''):'<div class="muted">这一档暂无记录。</div>'}`;
}
function openCity(city){navState.city=city;navState.rank=null;navState.icon=null;renderRecords()}
function openRank(rank){navState.rank=rank;navState.icon=null;renderRecords()}
function backToRanks(){navState.rank=null;navState.icon=null;renderRecords()}
function filterIcon(icon){navState.icon=icon;renderRecords()}
function clearIconFilter(){navState.icon=null;renderRecords()}
function openRecord(id){
  const r=getBoard(current).records.find(x=>String(x.id)===String(id));
  if(!r)return;
  navState.recordId=id;
  const detail=document.getElementById('recordDetail');
  detail.classList.remove('hidden');
  detail.innerHTML=`
    <div class="between"><h3>${recordIcon(r)} ${escapeHtml(r.shop||'未命名店铺')}</h3><button class="btn soft" onclick="closeRecord()">关闭</button></div>
    <div class="tag">${escapeHtml(r.date||'未填写日期')}</div>
    <div class="tag">${escapeHtml(r.meal||'')}</div>
    ${r.city?`<div class="tag">🗺️ ${escapeHtml(r.city)}</div>`:''}
    ${r.district?`<div class="tag">📍 ${escapeHtml(r.district)}</div>`:''}
    ${r.amount?`<p>金额：¥${escapeHtml(r.amount)}</p>`:''}
    <p><strong>评价档次：</strong>${rankLabel(r.rank)}</p>
    ${r.dishes?`<p><strong>菜品详情：</strong><br>${escapeHtml(r.dishes).replace(/\n/g,'<br>')}</p>`:''}
    ${r.review?`<p><strong>整体感受：</strong><br>${escapeHtml(r.review)}</p>`:''}
    <button class="btn" onclick="editRecord('${r.id}')">编辑并继续写</button>`;
  detail.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeRecord(){document.getElementById('recordDetail').classList.add('hidden')}
function editRecord(id){
  const r=getBoard(current).records.find(x=>String(x.id)===String(id));
  if(!r)return;
  setMode('detail');
  renderDetail();
  const fill=(id,value)=>{const el=document.getElementById(id);if(el)el.value=value??''};
  fill('shop',r.shop);fill('customIcon',r.customIcon);fill('date',r.date);fill('meal',r.meal||'午餐');
  fill('amount',r.amount);fill('dishes',r.dishes);fill('review',r.review);fill('rank',r.rank||'okay');
  if(current==='travel')fill('city',r.city);
  const saveBtn=document.querySelector('#detailForm button[onclick="saveDetail()"]');
  if(saveBtn){saveBtn.textContent='保存修改';saveBtn.onclick=()=>updateRecord(id);}
  document.getElementById('detailPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
function updateRecord(id){
  const b=getBoard(current), r=b.records.find(x=>String(x.id)===String(id));
  if(!r)return;
  r.shop=document.getElementById('shop').value.trim();
  r.customIcon=document.getElementById('customIcon').value.trim();
  r.date=document.getElementById('date').value;r.meal=document.getElementById('meal').value;
  r.amount=document.getElementById('amount').value;r.dishes=document.getElementById('dishes').value;
  r.review=document.getElementById('review').value;r.rank=document.getElementById('rank').value;
  if(current==='travel')r.city=document.getElementById('city').value;
  save();renderRecords();alert('记录已更新！');
}
function escapeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 明确暴露给页面按钮使用，兼容部分手机浏览器的内联事件环境。
window.showHome=showHome;
window.openBoard=openBoard;
window.renderBoards=renderBoards;
window.setMode=setMode;
window.renderDetail=renderDetail;
window.renderQuickCity=renderQuickCity;
window.parseQuick=parseQuick;
window.editQuick=editQuick;
window.saveQuick=saveQuick;
window.saveDetail=saveDetail;
window.addCity=addCity;
window.openCity=openCity;window.openRank=openRank;window.backToRanks=backToRanks;
window.filterIcon=filterIcon;window.clearIconFilter=clearIconFilter;window.openRecord=openRecord;
window.closeRecord=closeRecord;window.editRecord=editRecord;window.updateRecord=updateRecord;


try{renderBoards();}catch(error){
  const el=document.getElementById('boards');
  if(el){
    el.innerHTML=boards.map(b=>`<button class="tile" onclick="openBoard('${b.id}')"><span class="emoji">${b.icon}</span><h3>${b.name}</h3><div class="muted">点击进入</div></button>`).join('');
  }
}
</script>
</body>
</html>
